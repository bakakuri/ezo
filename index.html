    </script>
    <style>
      html { background: #f6f4f9; }
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: #f6f4f9; color: #df1f52; font: 800 30px/1 'Noto Sans Georgian', 'BPG Arial', system-ui, sans-serif; }
      .boot i { display: block; width: 120px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, currentColor, transparent) 0 0 / 50% 100% no-repeat, rgba(223, 31, 82, 0.14); animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { background-position: -60px 0, 0 0; } to { background-position: 180px 0, 0 0; } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']), :root:not([data-theme='light']) .boot { background: #0a0810; color: #ff4775; } }
      :root[data-theme='dark'], :root[data-theme='dark'] .boot { background: #0a0810; color: #ff4775; }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
    </style>
